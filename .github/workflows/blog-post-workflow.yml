name: Latest writing

# Fills the block between <!-- BLOG-POST-LIST:START --> and :END in README.md
# from the clawrush RSS feed (which is itself generated by clawrush/tools/build_feed.py).
# If this stops updating, check that feed first — it is the upstream of this job.
on:
  schedule:
    # 04:00 UTC = 05:00 Lisbon — after the clawrush feed job at 03:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest essays into the README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://github.com/tonydzi/clawrush/raw/main/feed.xml"
          max_post_count: 5
          template: "- [$title]($url) &nbsp;<sub>$date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "readme: refresh latest writing"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
