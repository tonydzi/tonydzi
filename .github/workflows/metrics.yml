name: Profile metrics

# Why this exists instead of the usual one-line widgets:
# the public instances of github-readme-stats and github-profile-trophy were
# measured dead on 2026-08-01 — DEPLOYMENT_PAUSED (503) and DEPLOYMENT_DISABLED
# (402). A hotlinked widget is someone else's uptime; this job renders the same
# numbers into SVG files committed here, so the profile cannot show a broken card.
on:
  schedule:
    # 03:30 UTC = 04:30 Lisbon — inside the fleet night window (23:00-06:00).
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN (a classic PAT) gives richer data; without it the job
          # still runs on the workflow token, with public data only.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          # The account login, not the lab's display name. It was renamed
          # Palo-Alto-AI-Research-Lab -> tonydzi on 2026-08-09; GitHub's GraphQL
          # API does NOT follow the rename here, it answers "Could not resolve to
          # a User" and the job exits 1. That is what turned this card red every
          # night from 2026-08-09 to 2026-08-28 without anyone being paged.
          user: tonydzi
          filename: metrics.svg
          template: classic
          # "repositories" is deliberately NOT in this list: with a user-scoped
          # token it renders the stats of this ONE repo and prints "1 Repository",
          # which understates the account. Understating is as dishonest as inflating.
          base: header, activity, community, metadata
          config_timezone: Europe/Lisbon
          committer_message: "metrics: refresh stats card"

# No achievements/trophy card here on purpose. Measured 2026-08-01:
# plugin_achievements in lowlighter/metrics@3.34.0 queries `user.projects`
# (Projects classic), which GitHub has sunset — GraphQL answers `data: {user: null}`
# and the plugin renders a card that literally reads "Unexpected error".
# GitHub's own Achievements badges already show on the profile page (Settings →
# Profile → Show Achievements, plus private contributions included), so the real
# thing is on display and nothing here needs to fake it.
